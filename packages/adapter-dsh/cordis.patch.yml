# DSH 在 dsh.profile.bundles 里列出 dsh-chara-soul 时自动加载这一层（路径登记在仓库根目录 package.json 的 dsh.bundle.patch）。
# 不要把这段 insert 抄进 profile 的 cordis.patch.yml，否则 id 重复、设置无法保存。
- insert:
    - id: chara-soul
      name: dsh-chara-soul

# 「角色灵魂」预设（005 号决定）：本体陪聊用，只挂聊天用得上的工具；要干活就用 chara_envoy 派分身，分身按设置里的预设拿全套工具。
# 插件名与配置项照抄 DSH 0.2.x 官方预设（standard / minimal），升级 DSH 0.3 时要逐行核对。
# 子会话服务在宿主层，不随预设挂载，所以这里不挂 subagent 工具，chara_envoy 照样能派分身。
- insert:
    - id: preset-chara-soul
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chara-soul
        name: 角色灵魂
        description: 陪聊用：工具精简、早压缩，身份交给本性；读写文件、跑命令等活由分身去办。
        order: 30
        plugins:
          # 前缀必填；写中性的一句，身份由本性决定。后缀省略即为空，规则写在本性里，换预设也生效
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是一个陪伴用户的角色。你是谁、怎么说话，以下面的本性为准。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 记忆在会话外，压掉不丢东西，所以早压缩（参照 dsh-flash-presets：0.25 / 保留 2 万 token）
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.25
                  retainTokens: 20000
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
